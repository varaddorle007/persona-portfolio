<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="vd-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#000"/>
      <!-- Outer circular boundary -->
      <circle cx="50" cy="50" r="46" fill="#fff"/>
      <!-- Persona diagonal slash channel separating V and D -->
      <polygon points="54,-2 63,-2 45,102 36,102" fill="#000"/>
      <!-- Razor-sharp V inner cutout apex -->
      <polygon points="17,-2 46,-2 25,78" fill="#000"/>
      <!-- Geometric D inner counter with parallel spine and smooth bowl -->
      <path d="M 65.8,22 L 68,22 C 81.5,22 86.5,33 86.5,50 C 86.5,67 81.5,78 68,78 L 56.2,78 Z" fill="#000"/>
    </mask>
  </defs>
  <style>
    .vd-disc { fill: #cfd5df; }
    @media (prefers-color-scheme: light) {
      .vd-disc { fill: #181b20; }
    }
  </style>
  <rect class="vd-disc" width="100" height="100" mask="url(#vd-mask)"/>
</svg>
